name: Deploy Godzilla

on:
  push:
    branches:
      - test
      - staging

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '20.x'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install production dependencies
        run: npm install --only=production

      - name: Archive function package
        run: |
          zip -r functionapp.zip . -x ".git/*" ".github/*" "functionapp.zip"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Provision infra (RG, Storage, App Insights, Function App)
        env:
          FUNCTION_APP: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          LOCATION: "westeurope"
        run: |
          set -euo pipefail
          az account set --subscription "$SUBSCRIPTION_ID"

          echo "Ensuring resource group $RESOURCE_GROUP in $LOCATION"
          az group create --name "$RESOURCE_GROUP" --location "$LOCATION" --output none

          STORAGE_ACCOUNT="$(echo "${FUNCTION_APP//-/}sa" | tr '[:upper:]' '[:lower:]')"
          STORAGE_ACCOUNT="${STORAGE_ACCOUNT:0:22}"
          if ! az storage account show --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" --output none 2>/dev/null; then
            echo "Creating storage account $STORAGE_ACCOUNT"
            az storage account create \
              --name "$STORAGE_ACCOUNT" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --sku Standard_LRS \
              --kind StorageV2 \
              --https-only true \
              --min-tls-version TLS1_2 \
              --output none
          else
            echo "Storage account $STORAGE_ACCOUNT already exists"
          fi

          echo "Ensuring Application Insights (workspace-based)"
          AI_NAME="ai-${FUNCTION_APP}"
          if ! az monitor app-insights component show --app "$AI_NAME" --resource-group "$RESOURCE_GROUP" --output none 2>/dev/null; then
            az monitor app-insights component create \
              --app "$AI_NAME" \
              --location "$LOCATION" \
              --kind web \
              --resource-group "$RESOURCE_GROUP" \
              --application-type other \
              --output none
          fi
          AI_CONN=$(az monitor app-insights component show --app "$AI_NAME" --resource-group "$RESOURCE_GROUP" --query "connectionString" -o tsv)

          echo "Ensuring Function App"
          if ! az functionapp show --name "$FUNCTION_APP" --resource-group "$RESOURCE_GROUP" --output none 2>/dev/null; then
            az functionapp create \
              --name "$FUNCTION_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --consumption-plan-location "$LOCATION" \
              --storage-account "$STORAGE_ACCOUNT" \
              --runtime node \
              --functions-version 4 \
              --os-type Linux \
              --assign-identity \
              --output none
          fi

          echo "Apply core app settings"
          STORAGE_CONN=$(az storage account show-connection-string --name "$STORAGE_ACCOUNT" --resource-group "$RESOURCE_GROUP" --query connectionString -o tsv)
          CONTENT_SHARE="$(echo "func-${FUNCTION_APP}" | tr '[:upper:]' '[:lower:]' | cut -c1-60)"
          echo "Ensuring storage file share $CONTENT_SHARE"
          az storage share create \
            --name "$CONTENT_SHARE" \
            --connection-string "$STORAGE_CONN" \
            --quota 50 \
            --output none

          az functionapp config appsettings set \
            --name "$FUNCTION_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --settings \
              "FUNCTIONS_WORKER_RUNTIME=node" \
              "FUNCTIONS_EXTENSION_VERSION=~4" \
              "AzureWebJobsStorage=$STORAGE_CONN" \
              "WEBSITE_CONTENTAZUREFILECONNECTIONSTRING=$STORAGE_CONN" \
              "WEBSITE_CONTENTSHARE=$CONTENT_SHARE" \
              "APPLICATIONINSIGHTS_CONNECTION_STRING=$AI_CONN" \
              "WEBSITE_ENABLE_SYNC_UPDATE_SITE=true" \
              "WEBSITE_RUN_FROM_PACKAGE=1" \
            --output none

      - name: Propagate function app settings
        env:
          FUNCTION_APP: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RG_EXCLUSIONS: ${{ secrets.RESOURCE_GROUP_EXCLUSIONS }}
          REPO_DELAY: ${{ vars.DELAY_BEFORE_DESTRUCTION }}
          SECRET_DELAY: ${{ secrets.DELAY_BEFORE_DESTRUCTION }}
        run: |
          set -euo pipefail

          MISSING=0
          for v in CLIENT_ID CLIENT_SECRET TENANT_ID SUBSCRIPTION_ID RG_EXCLUSIONS; do
            if [ -z "${!v:-}" ]; then
              echo "Missing required secret: $v"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            exit 1
          fi

          CURRENT_DELAY=$(az functionapp config appsettings list \
            --name "$FUNCTION_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='DELAY_BEFORE_DESTRUCTION'].value" \
            -o tsv)

          if [ -n "$REPO_DELAY" ]; then
            DELAY_VALUE="$REPO_DELAY"
          elif [ -n "$SECRET_DELAY" ]; then
            DELAY_VALUE="$SECRET_DELAY"
          else
            DELAY_VALUE="$CURRENT_DELAY"
          fi

          if [ -z "$DELAY_VALUE" ]; then
            echo "No DELAY_BEFORE_DESTRUCTION value was provided via repository variable/secret and none exists on the Function App."
            echo "Please configure either a repository variable (recommended) or a secret named DELAY_BEFORE_DESTRUCTION."
            exit 1
          fi

          az functionapp config appsettings set \
            --name "$FUNCTION_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --settings \
              "CLIENT_ID=$CLIENT_ID" \
              "CLIENT_SECRET=$CLIENT_SECRET" \
              "TENANT_ID=$TENANT_ID" \
              "SUBSCRIPTION_ID=$SUBSCRIPTION_ID" \
              "RESOURCE_GROUP_EXCLUSIONS=$RG_EXCLUSIONS" \
              "DELAY_BEFORE_DESTRUCTION=$DELAY_VALUE"

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: functionapp.zip
